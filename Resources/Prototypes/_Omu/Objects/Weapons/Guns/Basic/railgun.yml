- type: entity
  name: Syndicate Energy Railgun
  id: WeaponSyndicateRailgun
  parent: [ WeaponProtoKineticAcceleratorBase, BaseCargoContraband ]
  description: Charges up to fire
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
    layers:
    - state: icon
    - state: icon
      visible: false
      shader: unshaded
      map: [ "charge" ]
    - state: animation-icon
      visible: false
      map: [ "empty-icon" ]
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Guns/Snipers/heavensgate.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Item
    sprite: _Goobstation/Objects/Weapons/Guns/Snipers/heavensgate.rsi
    size: Large
  - type: Gun
    soundGunshot:
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        empty-icon:
          True: { visible: False }
          False: { visible: True }
      enum.ChargedShotVisuals.Level:
        charge:
          0: { visible: False }
          1: { visible: True, color: "#66e0ff80" }
          2: { visible: True, color: "#66e0ffff" }
  - type: BasicEntityAmmoProvider
    proto: ProjectileSyndicateRailgunLight
  - type: ChargedShot
    chargeSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
      params:
        pitch: 0.9
    levels:
    - delay: 1
      projectile: ProjectileSyndicateRailgunMedium
      reticle:
        sprite: /Textures/Objects/Weapons/Guns/Projectiles/magic.rsi
        state: magicm_cyan
      sound:
        path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
        params:
        pitch: 1
    - delay: 2
      projectile: ProjectileSyndicateRailgunFull
      reticle:
        sprite: /Textures/Objects/Weapons/Guns/Projectiles/magic.rsi
        state: bluespace
      sound:
        path: /Audio/Effects/chime.ogg
        params:
          pitch: 1
