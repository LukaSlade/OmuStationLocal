- type: entity
  name: gunblade
  parent: [ BaseSword ]
  id: gunblade
  description: pew pew stabby stab
  components:
  # Goobstation edit start
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/sabre_drop.ogg
  # Goobstation edit start
  - type: Sprite
    sprite: Objects/Weapons/Melee/captain_sabre.rsi
  - type: MeleeWeapon
    animationRotation: -95 # WWDP
    wideAnimationRotation: -135 # WWDP
    heavyStaminaCost: 2.5 # goob edit
    attackRate: 1.5
    damage:
      types:
        Slash: 19 #cmon, it has to be at least BETTER than the rest. # Goob edit
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Reflect
    reflectProb: .3 # Goobstation
    spread: 90
  - type: Item
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/captain_sabre_storage_64x.rsi #Done in 64x64 because it looks way too puny in 32x32
    shape:
    - 0,0,0,3
  - type: Tag
    tags:
    - CaptainSabre
  - type: DisarmMalus
  - type: Gun
    fireRate: 60
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: Battery
    maxCharge: 300
    startingCharge: 300
  - type: HitscanBatteryAmmoProvider
    proto: SMGLaser
    fireCost: 2.5
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 999
    autoRechargePause: true
    autoRechargePauseTime: 2
  - type: AmmoCounter
  - type: AltFireMelee
    attackType: Heavy
