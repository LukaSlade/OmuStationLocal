- type: entity
  parent: [BaseStructure, BaseSyndicateContraband]
  id: SyndicatePlasmaProjector
  name: ARES-82e plasma projector
  description: The Accumulative Resonance Ejection System projects an impossibly hot magnetically binded spear of plasma in the direction it is aimed. The internal supermatter crystal can only fire 5 shots before becoming inert.
  components:
  - type: InteractionOutline
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: unshaded
        map: [ "enum.GunVisualLayers.MagUnshaded" ]
        shader: unshaded
    sprite: _Omu/Structures/Cannons/plasma_projector.rsi
  - type: Gun
    fireRate: 0.2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Omu/Weapons/railgunfire.ogg
      params:
        pitch: 0.80
  - type: Appearance
  - type: Anchorable
  - type: AmmoCounter
  - type: BasicEntityAmmoProvider
    proto: ProjectileSyndicatePlasmaCannon
    capacity: 5
    count: 5
  - type: GunSignalControl
    forceAdditionalTriggers: false
  - type: Rotatable
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
  - type: PointLight
    color: "#00f7ff"
    radius: 1.5
    energy: 3.0
