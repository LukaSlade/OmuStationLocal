- type: entity
  name: toy Hristov
  parent: [BaseWeaponShotgun, BaseGunWieldable]
  id: WeaponHristovFoam
  description: A very realistic looking, yet foam launching, recreation of a Hristov sniper rifle!
  components:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    sprite: Objects/Weapons/Guns/Snipers/heavy_sniper.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Snipers/heavy_sniper.rsi
  - type: Item
    sprite: Objects/Weapons/Guns/Snipers/heavy_sniper.rsi
    size: Huge
    shape:
      - 0,0,3,1
    storedRotation: 45
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - BulletFoam
    capacity: 5
    autoCycle: false
    proto: BulletFoam
    soundRack:
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
  - type: GunRequiresWield
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 8
    pvsIncrease: 0.8
  - type: Gun
    fireRate: 0.5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/sniper.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
    clumsyProof: true
  - type: PacifismAllowedGun

- type: entity
  name: toy C-20r
  parent: [BaseWeaponShotgun]
  id: WeaponC20rFoam
  description: A very realistic looking, yet foam launching, recreation of a C-20r submachine gun!
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/SMGs/c20r.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-4
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Objects/Weapons/Guns/SMGs/c20r.rsi
  - type: Item
    size: Large
    shape:
      - 0,0,2,1
    storedRotation: 45
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - BulletFoam
    capacity: 31
    proto: BulletFoam
  - type: Gun
    minAngle: 2
    maxAngle: 16
    fireRate: 8
    angleIncrease: 3
    angleDecay: 16
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/c-20r.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
    clumsyProof: true
  - type: PacifismAllowedGun

- type: entity
  name: toy Viper
  parent: [BaseWeaponShotgun]
  id: WeaponViperFoam
  description: A very realistic looking, yet foam launching, recreation of a Viper handgun! Out of all these weapons, this is the most likely to get you magdumped by security.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/viper.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Pistols/viper.rsi
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - BulletFoam
    capacity: 10
    proto: BulletFoam
    soundRack:
      path: /Audio/Weapons/Guns/Cock/pistol_cock.ogg
  - type: EmitSoundOnPickup
    sound:
      collection: PistolsPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: PistolsDrop
  - type: EmitSoundOnLand
    sound:
      collection: PistolsDrop
  - type: Gun
    fireRate: 6
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
      - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/pistol.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
    clumsyProof: true
  - type: PacifismAllowedGun
